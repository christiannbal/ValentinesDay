<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Day Proposal</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- First screen: Proposal -->
    <div class="container" id="proposalScreen">
        <h1>Will you be my Valentine?</h1>
        <img src="images/dino.jpg" alt="Cute dino" class="dino-image">
        <div class="button-container">
            <button id="yesButton">Yes</button>
            <button id="no">No</button>
        </div>
    </div>

    <!-- Second screen: Celebration -->
    <div class="celebration-screen" id="celebrationScreen">
        <div class="hearts-container"></div> <!-- Hearts animation container -->
        <h1 class="love-text">I LOVE YOU</h1>
        <img src="images/kat.gif" alt="Celebration GIF" class="celebration-dino">
        <h2 class="hooray-text">HOOORAAYYY!! You may now claim your FREE Milkshake!! (valid at ANY store) 🎉</h2>

        <!-- New centered text below the hooray message -->
        <h2 class="extra-text">
            I will see your FINE ASS, February 13th, 7:00PM STK Steakhouse. <br>
            BYOB (bring yo own booty)!!!
        </h2>
    </div>

    <script src="script.js"></script>
</body>
</html>
